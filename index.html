<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Extract names from a PDF in your browser.">
  <title>Nimilista</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #111; font: 16px/1.5 Arial, Helvetica, sans-serif; }
    main { max-width: 760px; padding: 40px 20px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    .header-tools { display: flex; align-items: center; gap: 12px; }
    .gear { padding: 0 3px; line-height: 1; background: none; border: none; font-size: 21px; color: #555; }
    .gear:hover { background: #f4f4f4; }
    #settings-panel { padding: 12px 0 16px; margin: -8px 0 25px; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }
    .settings-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .settings-top h2 { font-size: 16px; font-weight: 600; margin: 0; }
    .settings-check { display: flex; align-items: center; gap: 9px; margin-top: 12px; }
    .settings-check input { margin: 0; }
    .settings-note { color: #666; font-size: 13px; margin: 8px 0 0; }
    .name-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 8px; }
    .name-heading #names-label { margin-bottom: 0; }
    .name-options { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .name-options button { padding: 2px 0; border: 0; border-bottom: 1px solid #aaa; color: #666; background: none; font-size: 13px; }
    .name-options button[aria-pressed="true"] { color: #111; border-bottom: 2px solid #111; font-weight: 600; }
    .input-zone { margin-top: 4px; border: 1px solid #aaa; padding: 6px 10px 9px; transition: border-color .12s, background-color .12s; }
    .input-zone:focus-within { outline: 2px solid #444; outline-offset: 2px; }
    .input-zone.drag-over { border-color: #111; background: #f6f6f6; outline: 2px dashed #777; outline-offset: 2px; }
    .input-zone #source-text { border: 0; width: 100%; min-height: 155px; height: 160px; resize: vertical; padding: 8px 2px; font: inherit; outline: 0; }
    .input-zone #source-text:focus-visible { outline: none; }
    .input-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 6px 2px 0; border-top: 1px solid #eee; }
    .input-actions .input-tools { display: flex; align-items: center; gap: 14px; }
    .input-tools button { border: 0; border-bottom: 1px solid #bbb; padding: 3px 0; font-size: 13px; color: #555; }
    .input-actions #clean-button { padding: 5px 12px; }
    .drop-hint { color: #777; font-size: 12px; margin: 7px 2px 0; }
    h1 { font-size: 24px; font-weight: 600; margin: 0; }
    label { display: block; margin-bottom: 8px; }
    input[type="file"] { display: block; width: 100%; max-width: 100%; font: inherit; }
    input[type="file"][hidden] { display: none; }
    select, button, textarea { font: inherit; color: inherit; background: #fff; border: 1px solid #aaa; border-radius: 0; }
    select { padding: 4px 6px; }
    button { cursor: pointer; padding: 6px 12px; }
    button:disabled { opacity: .5; cursor: default; }
    button:hover:not(:disabled) { background: #f4f4f4; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid #444; outline-offset: 2px; }
    #status { min-height: 24px; margin: 18px 0 24px; color: #555; font-size: 14px; }
    #status.error { color: #a00000; }
    #results { margin-top: 28px; }
    #names-label { margin-bottom: 8px; font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 320px; padding: 10px; resize: vertical; line-height: 1.6; }
    .exports { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .note { color: #666; font-size: 13px; margin-top: 32px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .quiet-link { background: none; color: #666; border: 0; border-bottom: 1px solid #bbb; padding: 1px 0; font-size: 13px; }
    #debug-view h2 { font-size: 18px; font-weight: 600; margin: 24px 0 16px; }
    #debug-source { min-height: 180px; }
    #debug-report { min-height: 290px; font-family: monospace; font-size: 13px; }
    #debug-output { margin-top: 22px; }
    #debug-status { min-height: 22px; font-size: 14px; color: #555; }
  
  /* Compact layout */
  main { padding: 16px 14px 20px; }
  header { gap: 12px; margin-bottom: 12px; }
  .header-tools { gap: 8px; }
  h1 { font-size: 21px; }
  .gear { padding: 3px 5px; font-size: 19px; }
  .language-toggle { border: 0; padding: 5px 2px; background: none; color: #777; font-size: 12px; letter-spacing: .2px; white-space: nowrap; }
  .language-toggle .active { color: #111; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .language-toggle .lang-sep { color: #aaa; padding: 0 3px; }
  #settings-panel { padding: 8px 0 10px; margin: -3px 0 12px; }
  .settings-check { margin-top: 7px; gap: 7px; }
  .settings-note { margin: 5px 0 0; font-size: 12px; }
  .input-zone { margin-top: 0; padding: 3px 8px 6px; }
  .input-zone #source-text { min-height: 72px; height: 92px; padding: 6px 1px; }
  .input-actions { gap: 6px; padding: 4px 1px 0; }
  .input-actions .input-tools { gap: 10px; }
  .input-tools button { padding: 2px 0; }
  .input-actions #clean-button { padding: 4px 9px; }
  #status { min-height: 0; margin: 7px 0 9px; font-size: 13px; }
  #status:empty { margin: 0; }
  #results { margin-top: 12px; }
  .name-heading { gap: 5px 10px; margin-bottom: 5px; }
  #names-label { margin-bottom: 0; }
  .name-options { gap: 5px 10px; }
  textarea { min-height: 96px; padding: 7px; line-height: 1.45; }
  .exports { gap: 5px; margin-top: 6px; }
  .note { margin: 8px 0 0; font-size: 12px; }
  #open-debug { margin-top: 9px; }
  #debug-view h2 { font-size: 17px; margin: 9px 0 6px; }
  #debug-source { min-height: 112px; height: 130px; }
  #debug-report { min-height: 150px; height: 220px; font-size: 12px; }
  #debug-output { margin-top: 10px; }
  #debug-status { min-height: 0; margin: 7px 0 0; font-size: 13px; }
  #debug-status:empty, #diagnostics-status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nimilista</h1>
      <div class="header-tools">
        <button type="button" id="language" class="language-toggle" value="en" aria-label="Switch to Finnish" title="Switch to Finnish"><span id="lang-fi">FI</span><span class="lang-sep" aria-hidden="true">/</span><span id="lang-en" class="active">EN</span></button>
        <button type="button" class="gear" id="open-settings" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings-panel"><span aria-hidden="true">⚙︎</span></button>
      </div>
    </header>
    <section id="settings-panel" hidden aria-labelledby="settings-title">
      <div class="settings-top">
        <h2 id="settings-title">Settings</h2>
        <button type="button" class="quiet-link" id="close-settings">Close</button>
      </div>
      <label class="settings-check" for="filter-products">
        <input type="checkbox" id="filter-products" checked>
        <span id="filter-products-label">Filter known product names</span>
      </label>
      <p class="settings-note" id="settings-note">Remove common software and service names from the result.</p>
    </section>

    <section id="normal-view">
    <section id="input-zone" class="input-zone" aria-label="Name list input">
      <label for="pdf" id="file-label" class="sr-only">Choose file</label>
      <input id="pdf" type="file" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp,image/bmp,.txt,.csv,.tsv,text/plain,text/csv,text/tab-separated-values" multiple hidden>
      <label for="source-text" id="paste-label" class="sr-only">Paste text or an image</label>
      <textarea id="source-text" spellcheck="false" placeholder="Paste text, screenshot or drop a file…"></textarea>
      <div class="input-actions">
        <div class="input-tools">
          <button type="button" id="choose-file">Choose file</button>
          <button type="button" id="paste-image">Paste</button>
        </div>
        <button type="button" id="clean-button">Extract names</button>
      </div>
      </section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="diagnostics-section" hidden>
      <button type="button" id="diagnostics-copy">Copy diagnostics</button>
      <p class="note" id="diagnostics-note">Technical counts and error categories only. No names, PDF text or filename.</p>
      <p id="diagnostics-status" role="status" aria-live="polite"></p>
    </section>

    <section id="results" hidden>
      <div class="name-heading">
        <label id="names-label" for="names">Names (0)</label>
        <div class="name-options" aria-label="Name formatting">
          <button type="button" id="last-first" aria-pressed="false">Last name first</button>
          <button type="button" id="hide-middle" aria-pressed="false">Hide middle names</button>
        </div>
      </div>
      <textarea id="names" spellcheck="false" aria-label="Extracted names"></textarea>
      <div class="exports">
        <button type="button" data-export="txt">TXT</button>
        <button type="button" data-export="csv">CSV</button>
        <button type="button" data-export="tsv">TSV</button>
        <button type="button" data-export="json">JSON</button>
        <button type="button" data-export="xlsx">XLSX</button>
        <button type="button" data-export="copy" id="copy-button">Copy</button>
      </div>
    </section>
    <button type="button" class="quiet-link" id="open-debug">Debug</button>
    </section>

    <section id="debug-view" hidden>
      <button type="button" class="quiet-link" id="close-debug">Back</button>
      <h2 id="debug-title">Text diagnostics</h2>
      <p class="note" id="debug-note">Words and numbers are masked locally. Review before sharing.</p>
      <label for="debug-source" id="debug-label">Paste text to diagnose</label>
      <textarea id="debug-source" spellcheck="false" placeholder="Paste text here"></textarea>
      <div class="exports">
        <button type="button" id="debug-generate">Generate sanitized report</button>
        <button type="button" id="debug-ocr-show" disabled>View sanitized OCR text</button>
      </div>
      <p id="debug-ocr-hint" class="note">Run image or scanned-PDF OCR first.</p>
      <section id="debug-output" hidden>
        <label for="debug-report" id="debug-output-label">Sanitized report (review before copying)</label>
        <textarea id="debug-report" readonly spellcheck="false"></textarea>
        <div class="exports">
          <button type="button" id="debug-copy">Copy sanitized report</button>
          <button type="button" id="debug-ocr-copy" hidden>Copy all sanitized OCR text</button>
        </div>
      </section>
      <p id="debug-status" role="status" aria-live="polite"></p>
    </section>
  </main>

    let pdfLibraryPromise = null;
    async function getPdfLibrary() {
      if (!pdfLibraryPromise) {
        pdfLibraryPromise = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.5.438/pdf.min.mjs')
          .then(lib => {
            lib.GlobalWorkerOptions.workerSrc =
              'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.5.438/pdf.worker.min.mjs';
            return lib;
          });
      }
      return pdfLibraryPromise;

    let currentStatus = 'empty';
    let statusArgs = [];
    let ocrWorker = null;
    let activeRun = 0;
    let documentProcessing = false;
    let diagnostics = null;
    let diagnosticsFeedback = '';
    let latestOcrDebugReport = '';

    let lastRenderedRows = [];
    let lastNameFirst = false;
    let hideMiddleNames = false;
    let filterProductsEnabled = true;
    const loadedScripts = new Map();

    // This report is constructed from a strict set of counters and fixed status codes.
    // Never add PDF text, extracted names, PDF metadata, filenames, or raw exceptions.
    function newDiagnostics(file) {
      return {
        report_version: 1,
        app: 'Nimilista',
        file_size_bytes: Number(file.size) || 0,
        status: 'processing',
        stage: 'file_selected',
        pdf_page_count: null,
        pages: [],
        detected_names_count: null,
        page_cleanup_failures: 0,
        document_cleanup_failed: false,
        error_code: null,
        error_type: null
      };
    }

    function classifyFailure(error, stage) {
      const names = {
        PasswordException: 'PASSWORD_PROTECTED',
        InvalidPDFException: 'INVALID_PDF',
        MissingPDFException: 'MISSING_PDF',
        UnexpectedResponseException: 'PDF_FETCH_ERROR'
      };
      if (error && Object.prototype.hasOwnProperty.call(names, error.name)) return names[error.name];
      if (stage === 'library_load') return 'PDF_LIBRARY_LOAD_FAILED';
      if (stage === 'ocr') return 'OCR_FAILED';
      if (stage === 'pdf_open') return 'PDF_OPEN_FAILED';
      if (stage === 'text_read') return 'TEXT_EXTRACTION_FAILED';
      if (stage === 'page_load') return 'PAGE_LOAD_FAILED';
      if (stage === 'name_extraction') return 'NAME_EXTRACTION_FAILED';
      if (stage === 'page_cleanup' || stage === 'document_cleanup') return 'CLEANUP_FAILED';
      return 'UNEXPECTED_FAILURE';
    }

    function safeReport() {
      if (!diagnostics) return '';
      const safeNumber = value => Number.isSafeInteger(value) && value >= 0 ? value : null;

    function isKnownProductName(value) {
      const key = String(value || '').normalize('NFKC').toLocaleLowerCase('fi')
        .replace(/[®™]/g, '').replace(/\s+/g, ' ').trim();

    // Keep original full names so both display options can be reversed.
    function formatPersonName(value, lastFirst = lastNameFirst, hideMiddle = hideMiddleNames) {
      const words = String(value || '').trim().split(/\s+/).filter(Boolean);
      if (words.length < 2) return words.join(' ');
      let surnameStart = words.length - 1;
      while (surnameStart > 1 && particles.has(words[surnameStart - 1].toLocaleLowerCase('fi'))) {
        surnameStart--;
      }
      const given = words.slice(0, surnameStart);
      const family = words.slice(surnameStart);
      const shownGiven = hideMiddle ? given.slice(0, 1) : given;
      return (lastFirst ? family.concat(shownGiven) : shownGiven.concat(family)).join(' ');
    }

    // Convert only newly edited rows from displayed order to source order.
    function undoNameFormatting(displayed) {
      const value = displayed.trim();
      if (!lastNameFirst) return value;
      const words = value.replace(',', ' ').split(/\s+/).filter(Boolean);
      if (words.length < 2) return value;
      let surnameEnd = 1;
      if (particles.has(words[0].toLocaleLowerCase('fi'))) {
        while (surnameEnd < words.length - 1 &&
               particles.has(words[surnameEnd].toLocaleLowerCase('fi'))) surnameEnd++;
        surnameEnd = Math.min(surnameEnd + 1, words.length - 1);
      }
      return words.slice(surnameEnd).concat(words.slice(0, surnameEnd)).join(' ');
    }

    // Preserve unedited full names if users manually change other rows.
    function syncEditedNames() {
      const visible = ui.names.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const old = lastRenderedRows.map(row => row.displayed);
      if (visible.length === old.length && visible.every((item, i) => item === old[i])) return;
      const lookup = new Map();
      for (const row of lastRenderedRows) {
        if (!lookup.has(row.displayed)) lookup.set(row.displayed, []);
        lookup.get(row.displayed).push(row.source);
      }
      const replacements = visible.map(item => {
        const queue = lookup.get(item);
        return queue && queue.length ? queue.shift() : undoNameFormatting(item);
      });
      const next = [];
      let i = 0;
      for (const oldName of sourceNames) {
        if (filterProductsEnabled && isKnownProductName(oldName)) next.push(oldName);
        else if (i < replacements.length) next.push(replacements[i++]);

      while (i < replacements.length) next.push(replacements[i++]);

    function loadScript(url) {
      if (loadedScripts.has(url)) return loadedScripts.get(url);
      const promise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Script failed: ' + url));

    // PDF.js may return letters or syllables rather than whole words.
    // Join adjacent fragments without spaces; preserve actual PDF whitespace.
    function pdfLines(items, stats = null) {
      const positioned = items
        .filter(item => typeof item.str === 'string' && item.str.trim())
        .map(item => ({
          text: item.str.replace(/\s+/g, ' '),
          x: item.transform ? item.transform[4] : 0,
          y: item.transform ? item.transform[5] : 0,
          width: Number(item.width) || 0,
          fontSize: Math.abs(Number(item.transform && item.transform[3])) || Number(item.height) || 10
        }))
        .sort((a, b) => b.y - a.y || a.x - b.x);

      const rows = [];
      for (const item of positioned) {
        const last = rows[rows.length - 1];
        if (!last || Math.abs(last.y - item.y) > 3) {
          rows.push({ y: item.y, items: [item] });
        } else {
          last.items.push(item);
        }
      }

      let mergedFragments = 0;
      let separatedFragments = 0;
      const lines = rows.map(row => {
        row.items.sort((a, b) => a.x - b.x);
        let line = '';
        let previous = null;
        for (const item of row.items) {
          if (previous) {
            const gap = item.x - previous.x - previous.width;
            const wordGap = Math.max(1.2, Math.min(previous.fontSize, item.fontSize) * 0.18);
            const explicitSpace = /\s$/.test(line) || /^\s/.test(item.text);
            if (gap > 22) {
              line += '\t';
              separatedFragments++;
            } else if (gap > wordGap) {
              if (!explicitSpace) line += ' ';
              separatedFragments++;
            } else if (!explicitSpace) {
              mergedFragments++;
            }
          }
          line += item.text;
          previous = item;
        }
        return line.trim().replace(/[ ]{2,}/g, ' ');
      }).filter(Boolean);
      if (stats) {
        stats.fragment_joins = mergedFragments;
        stats.fragment_separations = separatedFragments;
      }
      return lines;
    }

    async function getOcrWorker() {
      if (!ocrWorker) {
        await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
        // Tesseract downloads the Finnish and English language models only when needed.
        ocrWorker = await window.Tesseract.createWorker(['eng', 'fin']);
        // Prefer automatic page segmentation and keep visual word gaps.
        try {
          await ocrWorker.setParameters({
            tessedit_pageseg_mode: String(window.Tesseract.PSM?.AUTO ?? '3'),
            preserve_interword_spaces: '1',
            user_defined_dpi: '300'
          });
        } catch (_) { /* Keep engine defaults if unsupported. */ }
      }
      return ocrWorker;
    }

    async function readScannedPage(page) {
      const worker = await getOcrWorker();
      const view = page.getViewport({ scale: 1 });
      const scale = Math.min(2.2, 2000 / Math.max(view.width, view.height));
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      try {
        await page.render({ canvasContext: ctx, viewport }).promise;
        const result = await worker.recognize(canvas);
        return result.data.text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      } finally {
        canvas.width = 0;
        canvas.height = 0;
      }
    }

    const excluded = new Set([
      'name', 'names', 'first', 'last', 'firstname', 'lastname', 'surname', 'given',
      'list', 'people', 'person', 'page', 'pages', 'date', 'number', 'address',
      'phone', 'email', 'contact', 'signature', 'total', 'participants', 'attendees',
      'employee', 'employees', 'customer', 'customers', 'registered', 'member',
      'members', 'table', 'document', 'report', 'department', 'organization',
      'university', 'school', 'company', 'city', 'country', 'street', 'information',
      'nimi', 'nimet', 'nimilista', 'etunimi', 'sukunimi', 'henkilö', 'henkilöt',
      'luettelo', 'lista', 'sivu', 'sivut', 'päivä', 'päivämäärä', 'numero',
      'osoite', 'puhelin', 'sähköposti', 'yhteystiedot', 'allekirjoitus',
      'yhteensä', 'osallistujat', 'jäsenet', 'jäsen', 'työntekijä', 'asiakas',
      'taulukko', 'tiedot', 'yritys', 'kaupunki', 'koulu', 'yliopisto',
      'the', 'and', 'with', 'for', 'from', 'of', 'on', 'ja', 'tai', 'sekä', 'oy', 'ry',
      'ltd', 'inc', 'ab', 'www', 'http', 'https', 'class', 'grade', 'score',
      'scores', 'point', 'points', 'luokka', 'piste', 'pisteet',
      'oppilas', 'student', 'students', 'tulos', 'tulokset'
    ]);
    const particles = new Set(['de', 'del', 'van', 'von', 'der', 'den', 'da', 'di', 'af', 'la', 'le']);

    function nameWord(word, index) {
      const key = word.toLocaleLowerCase('fi');
      if (excluded.has(key)) return false;
      if (particles.has(key)) return index > 0;
      if (word.length < 2) return false;
      return /^\p{Lu}[\p{L}\p{M}'’.-]*$/u.test(word) &&
        !/[.'’\-]$/.test(word);
    }

    function candidate(value) {
      let s = value.normalize('NFC').replace(/\u00a0/g, ' ').trim();
      s = s.replace(/^[•·*]\s*/, '').replace(/^\d{1,5}[.)-]?\s+/, '');
      s = s.replace(/^(Mr|Mrs|Ms|Dr|Prof|Herra|Rouva)\.?\s+/i, '');
      s = s.replace(/\s+/g, ' ');
      if (!s || s.length > 90 || /[0-9@:/\\()[\]!?=+]/.test(s)) return null;
      const comma = s.match(/^([^,]+),\s*([^,]+)$/);
      if (comma) s = comma[2] + ' ' + comma[1];
      else if (s.includes(',')) return null;
      const parts = s.split(' ');
      if (parts.length < 2 || parts.length > 5) return null;
      if (!parts.every(nameWord)) return null;
      if (parts.filter(part => !particles.has(part.toLowerCase())).length < 2) return null;
      return s;
    }


    // Extract names from tabular rows where a class code (e.g. 3A) follows
    // the name, optionally followed by arbitrarily many numeric columns.
    function rosterCandidate(cell) {
      const text = String(cell || '').normalize('NFC')
        .replace(/[\u00a0\u2007\u202f]/g, ' ').trim()
        .replace(/^\d{1,6}[.)-]?\s+/, '');
      const direct = candidate(text);
      if (direct) return direct;
      const match = text.match(/^(.+?)\s+\d{1,2}\p{Lu}(?:\/\d{1,2}\p{Lu})?(?=$|[\s;,|\t])/u);
      return match ? candidate(match[1]) : null;
    }

    function extractFromLine(line) {
      const pieces = line.trim().split(/\t|[;|]|\s{3,}/).map(s => s.trim()).filter(Boolean);
      if (pieces.some(part => /^(?:name|full name|first name|last name|surname|given name|nimi|etunimi|sukunimi)$/iu.test(part))) return [];
      const found = pieces.map(rosterCandidate).filter(Boolean);
      if (found.length) return found;
      // Names split across two adjacent table cells, even if other cells
      // contain unrelated numbers or dates.
      const paired = [];
      for (let i = 0; i + 1 < pieces.length; i++) {
        if (/\s/.test(pieces[i]) || /\s/.test(pieces[i + 1])) continue;
        const person = candidate(pieces[i] + ' ' + pieces[i + 1]);
        if (person) {
          paired.push(person);
          i++;
        }
      }
      if (paired.length) return paired;
      const singleWords = pieces
        .filter(s => !/^\d+[.)-]?$/.test(s))
        .map(s => s.replace(/^\d{1,5}[.)-]?\s+/, ''));
      if ((singleWords.length === 2 || singleWords.length === 4) &&
          singleWords.every(s => !/\s/.test(s))) {
        const names = [];
        for (let i = 0; i < singleWords.length; i += 2) {
          const person = candidate(singleWords[i] + ' ' + singleWords[i + 1]);
          if (!person) return [];
          names.push(person);
        }
        return names;
      }
      const whole = rosterCandidate(line);
      return whole ? [whole] : [];
    }

    function extractNames(lines) {
      const names = [];
      const seen = new Set();
      for (const line of lines) {
        for (const name of extractFromLine(line)) {
          const key = name.toLocaleLowerCase('fi').normalize('NFC');
          if (!seen.has(key)) {
            seen.add(key);
            names.push(name);
          }
        }
      }
      return names;
    }


    // Clean pasted PDF/text tables locally. This never sends the input anywhere.
    function cleanPastedNames(source) {
      const names = [];
      const seen = new Set();
      const add = raw => {
        const clean = raw.normalize('NFC').trim().replace(/\s+/g, ' ');
        const key = clean.toLocaleLowerCase('fi');
        if (clean && !seen.has(key)) {
          seen.add(key);
          names.push(clean);
        }
      };
      const normalizeWord = word =>
        /^[\p{Lu}\p{M}'’.-]+$/u.test(word) && /\p{Lu}{2,}/u.test(word)
          ? word.charAt(0) + word.slice(1).toLocaleLowerCase('fi') : word;
      const normalizedCandidate = raw => {
        const text = String(raw || '').normalize('NFC')
          .replace(/[\u00a0\u2007\u202f]/g, ' ')
          .replace(/^[\s•·*#-]*/, '')
          .replace(/^\d{1,6}[\s.)-]+/, '')
          .replace(/[ \t]+/g, ' ').trim();
        return rosterCandidate(text.split(' ').map(normalizeWord).join(' '));
      };
      const single = raw => {
        const word = raw.trim();
        return !/\s/.test(word) &&
          /^[\p{Lu}][\p{L}\p{M}'’.-]+$/u.test(word) &&
          !excluded.has(word.toLocaleLowerCase('fi'));
      };
      const headerType = cell => {
        const label = cell.trim().toLocaleLowerCase('fi').replace(/[.:*]/g, '').replace(/\s+/g, ' ');
        if (['etunimi', 'etunimet', 'first name', 'given name'].includes(label)) return 'first';
        if (['sukunimi', 'last name', 'surname', 'family name'].includes(label)) return 'last';
        if (['nimi', 'koko nimi', 'name', 'full name'].includes(label)) return 'full';
        return null;
      };
      let header = null;
      const lines = source.normalize('NFC').replace(/\r\n?/g, '\n').split('\n');
      for (const originalLine of lines) {
        const row = originalLine.replace(/[\u00a0\u2007\u202f]/g, ' ').trim();
        if (!row || row.length > 1200) continue;
        const cells = row.split(/\t|[;|]|\s{3,}/).map(c => c.trim()).filter(Boolean);
        if (!cells.length) continue;
        const headings = cells.map(headerType);
        if ((headings.includes('first') && headings.includes('last')) ||
             (headings.includes('full') && cells.length > 1)) {
          header = headings;
          continue;
        }
        if (header && cells.length === header.length) {
          const first = header.indexOf('first');
          const last = header.indexOf('last');
          const full = header.indexOf('full');
          const value = full >= 0 ? normalizedCandidate(cells[full]) :
            (first >= 0 && last >= 0
              ? normalizedCandidate(cells[first] + ' ' + cells[last]) : null);
          if (value) {
            add(value);
            continue;
          }
        }
        let found = [];
        const whole = normalizedCandidate(row);
        if (whole) found.push(whole);
        if (!found.length) {
          for (const cell of cells) {
            const exact = normalizedCandidate(cell);
            if (exact) {
              found.push(exact);
              continue;
            }
            // Strict score-only suffix; never strip timestamps, IDs or
            // mixed numeric codes from headings.
            const numericTail = cell.match(/^(.+?)\s+\d+(?:[.,]\d+)?(?:\s+\d+(?:[.,]\d+)?)*$/u);
            if (numericTail && /\p{Ll}/u.test(numericTail[1])) {
              const front = normalizedCandidate(numericTail[1]);
              if (front) found.push(front);
            }
            const comma = cell.match(/^([\p{L}'’-]+),\s*([\p{L}'’-]+)$/u);
            if (comma) {
              const swapped = normalizedCandidate(comma[2] + ' ' + comma[1]);
              if (swapped) found.push(swapped);
            }
          }
        }
        if (!found.length) {
          for (let i = 0; i + 1 < cells.length; i++) {
            if (!single(cells[i]) || !single(cells[i + 1])) continue;
            const pair = normalizedCandidate(cells[i] + ' ' + cells[i + 1]);
            if (pair) {
              found.push(pair);
              i++;
            }
          }
        }
        // Do not guess from arbitrary capitalized prefixes before a number:
        // headings followed by dates/times otherwise become false names.
        found.forEach(add);
      }
      return names;
    }


    // Strict structural encoding: never copy source words or numbers.
    // All content tokens become fixed categories, including missed names.
    function textShape(line) {
      return Array.from(line.matchAll(/[\p{L}\p{M}]+|[\p{N}]+|[^\p{L}\p{M}\p{N}\s]+|\s+/gu), m => {
        const value = m[0];
        if (/^\s+$/u.test(value)) {
          return value.replace(/\t/g, '\\t').replace(/ +/g, part => part.length >= 3 ? '   ' : part);
        }
        if (/^\p{N}+$/u.test(value)) return '<NUMBER>';
        if (/[\p{L}\p{M}]/u.test(value)) {
          const chars = Array.from(value).filter(c => /\p{L}/u.test(c));
          const size = chars.length === 1 ? '1' : chars.length <= 4 ? '2-4' : chars.length <= 8 ? '5-8' : '9+';
          const upper = chars.every(c => /\p{Lu}/u.test(c));
          const lower = chars.every(c => /\p{Ll}/u.test(c));
          const title = chars.length > 1 && /\p{Lu}/u.test(chars[0]) &&
            chars.slice(1).every(c => /\p{Ll}/u.test(c));
          return '<' + (upper ? 'UPPER' : lower ? 'lower' : title ? 'Title' : 'Mixed') + ':' + size + '>';
        }
        return Array.from(value, char => /[.,;:|/\\()\-+@=%#\[\]]/u.test(char) ? char : '·').join('');
      }).join('');
    }


    // OCR words may include names the detector misses: mask EVERY word and
    // number, not merely those classified as personal names.
    function sanitizeOcrBlock(rawText, itemNumber) {
      const lines = String(rawText || '').replace(/\r\n?/g, '\n').split('\n');
      return {
        item: itemNumber,
        line_count: lines.length,
        lines: lines.map((raw, i) => {
          let pasteCount = null;
          let pdfCount = null;
          try { pasteCount = cleanPastedNames(raw).length; } catch (_) {}
          try { pdfCount = extractFromLine(raw).length; } catch (_) {}
          return { line: i + 1, sanitized_text: textShape(raw),
            paste_detected: pasteCount, pdf_line_detected: pdfCount };
        })
      };
    }
    function publishSanitizedOcrReport(source, blocks) {
      if (!blocks.length) return;
      // Blocks contain only masked shapes and fixed/numeric fields.
      latestOcrDebugReport = JSON.stringify({
        report_version: 1, app: 'Nimilista',
        kind: 'sanitized_ocr_full_text',
        source: source === 'pdf_ocr' ? 'pdf_ocr' : 'image_ocr',
        note: 'All words and numbers masked. Review patterns before sharing.',
        total_lines: blocks.reduce((sum, block) => sum + block.line_count, 0),
        items: blocks
      }, null, 2);
      ui.debugOcrShow.disabled = false;
      ui.debugOcrHint.hidden = true;
    }
    function clearSanitizedOcrReport() {
      latestOcrDebugReport = '';
      ui.debugOcrShow.disabled = true;
      ui.debugOcrHint.hidden = false;
      if (!ui.debugOcrCopy.hidden) {
        ui.debugOutput.hidden = true;
        ui.debugReport.value = '';
        ui.debugOcrCopy.hidden = true;
        ui.debugCopy.hidden = false;
        ui.debugStatus.textContent = '';
      }
    }

    function makeSanitizedDebugReport(source) {
      const lines = source.normalize('NFC').replace(/\r\n?/g, '\n').split('\n');
      const layout = { empty: 0, tabbed: 0, semicolon: 0, comma: 0, multiple_spaces: 0 };
      const sample = [];
      let nonempty = 0;
      let pasteNames = null;
      let pdfStyleNames = null;
      try { pasteNames = cleanPastedNames(source).length; } catch (_) {}
      try { pdfStyleNames = extractNames(lines).length; } catch (_) {}
      for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (!line.trim()) { layout.empty++; continue; }
        nonempty++;
        if (line.includes('\t')) layout.tabbed++;
        if (line.includes(';')) layout.semicolon++;
        if (line.includes(',')) layout.comma++;
        if (/ {3,}/.test(line)) layout.multiple_spaces++;
        if (sample.length >= 32) continue;
        let pasteDetected = null;
        let pdfDetected = null;
        try { pasteDetected = cleanPastedNames(line).length; } catch (_) {}
        try { pdfDetected = extractFromLine(line).length; } catch (_) {}
        sample.push({
          line: index + 1,
          shape: textShape(line).slice(0, 320),
          paste_detected: pasteDetected,
          pdf_line_detected: pdfDetected
        });
      }
      return JSON.stringify({
        report_version: 1,
        app: 'Nimilista',
        kind: 'sanitized_text_structure',
        note: 'Words and numbers replaced. Review the structural patterns before sharing.',
        line_count: lines.length,
        nonempty_line_count: nonempty,
        layout_counts: layout,
        paste_clean_names_detected: pasteNames,
        pdf_style_names_detected: pdfStyleNames,
        sample_lines: sample,
        sample_truncated: nonempty > sample.length
      }, null, 2);
    }

    async function extractPdf(file, runId) {
      diagnostics.stage = 'library_load';
      const pdfjsLib = await getPdfLibrary();
      diagnostics.stage = 'pdf_open';
      const pdf = await pdfjsLib.getDocument({
        data: new Uint8Array(await file.arrayBuffer()),
        isEvalSupported: false
      }).promise;
      diagnostics.pdf_page_count = pdf.numPages;
      const lines = [];
      const scannedBlocks = [];
      try {
        for (let number = 1; number <= pdf.numPages; number++) {
          if (runId !== activeRun) return [];
          setStatus('reading', number, pdf.numPages);
          const pageDiagnostic = {
            page: number, text_items: 0, text_characters: 0,
            text_lines: 0, fragment_joins: 0, fragment_separations: 0, ocr_attempted: false, ocr_lines: null, completed: false
          };
          diagnostics.pages.push(pageDiagnostic);
          diagnostics.stage = 'page_load';
          const page = await pdf.getPage(number);
          try {
            diagnostics.stage = 'text_read';
            const text = await page.getTextContent();
            pageDiagnostic.text_items = text.items.length;
            let pageLines = pdfLines(text.items, pageDiagnostic);
            pageDiagnostic.text_lines = pageLines.length;
            pageDiagnostic.text_characters = pageLines.reduce((total, line) => total + line.length, 0);
            // Preserve the original OCR trigger and name-extraction method.
            if (pageLines.join(' ').replace(/\s/g, '').length < 20) {
              pageDiagnostic.ocr_attempted = true;
              diagnostics.stage = 'ocr';
              setStatus('ocr', number, pdf.numPages);
              pageLines = await readScannedPage(page);
              pageDiagnostic.ocr_lines = pageLines.length;
              scannedBlocks.push(sanitizeOcrBlock(pageLines.join('\n'), number));
              publishSanitizedOcrReport('pdf_ocr', scannedBlocks);
            }
            lines.push(...pageLines);
            pageDiagnostic.completed = true;
          } finally {
            // Cleanup is best-effort. A cleanup error must not discard the text
            // already read from the PDF, or prevent name extraction.
            try {
              page.cleanup();
            } catch (_) {
              diagnostics.page_cleanup_failures++;
            }
          }
        }
      } finally {
        try {
          await pdf.destroy();
        } catch (_) {
          diagnostics.document_cleanup_failed = true;
        }
      }
      diagnostics.stage = 'name_extraction';
      return extractNames(lines);
    }

    function filename(extension) {
      return 'nimilista.' + extension;
    }

    function download(data, extension, mime) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename(extension);
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function csvCell(value) {
      const safe = /^[\s]*[=+\-@]/.test(value) ? "'" + value : value;
      return '"' + safe.replace(/"/g, '""') + '"';
    }

    async function exportNames(format) {
      const names = getNames();
      if (!names.length) return;
      const heading = translate('names');
      try {
        if (format === 'copy') {
          const content = names.join('\n');
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(content);
          } else {
            ui.names.focus();
            ui.names.select();
            if (!document.execCommand('copy')) throw new Error('Copy failed');
          }
          setStatus('copied');
        } else if (format === 'txt') {
          download(names.join('\n') + '\n', 'txt', 'text/plain;charset=utf-8');
        } else if (format === 'json') {
          download(JSON.stringify(names, null, 2) + '\n', 'json', 'application/json;charset=utf-8');
        } else if (format === 'csv') {
          download('\ufeff' + [heading, ...names].map(csvCell).join('\r\n') + '\r\n', 'csv', 'text/csv;charset=utf-8');
        } else if (format === 'tsv') {
          download('\ufeff' + [heading, ...names].join('\r\n') + '\r\n', 'tsv', 'text/tab-separated-values;charset=utf-8');
        } else if (format === 'xlsx') {
          await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
          const sheet = window.XLSX.utils.aoa_to_sheet([[heading], ...names.map(n => [n])]);
          sheet['!cols'] = [{ wch: 34 }];
          const book = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(book, sheet, 'Nimilista');
          window.XLSX.writeFile(book, filename('xlsx'));
        }
      } catch (error) {
        console.error(error);
        setStatus(format === 'copy' ? 'copyError' : 'exportError');
      }
    }


    const supportedImageTypes = new Set(['image/png', 'image/jpeg', 'image/webp', 'image/bmp']);
    const maxImageSize = 20 * 1024 * 1024;

    function setDocumentProcessing(value) {
      documentProcessing = value;
      ui.file.disabled = value;
      ui.chooseFile.disabled = value;
      ui.pasteImage.disabled = value;
      ui.cleanButton.disabled = value;
      ui.sourceText.disabled = value;
    }


    // Prepare small screenshots, low-contrast text, and dark-mode captures.
    // Keep anti-aliasing: binary thresholding often destroys Finnish accents.
    async function prepareOcrImage(blob) {
      let source;
      let release = () => {};
      if (typeof createImageBitmap === 'function') {
        source = await createImageBitmap(blob);
        release = () => source.close();
      } else {
        const url = URL.createObjectURL(blob);
        try {
          source = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error('Cannot decode image'));
            image.src = url;
          });
        } finally { URL.revokeObjectURL(url); }
      }

      try {
        const width = source.width || source.naturalWidth;
        const height = source.height || source.naturalHeight;
        if (!(width > 0 && height > 0)) throw new Error('Empty image');
        const longSide = Math.max(width, height);
        const scale = Math.min(3, Math.max(1, 2500 / longSide),
          4000 / longSide, Math.sqrt(10000000 / (width * height)));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) throw new Error('No 2D context');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(source, 0, 0, canvas.width, canvas.height);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const values = imageData.data;
        const histogram = new Uint32Array(256);
        const count = canvas.width * canvas.height;
        const stride = Math.max(1, Math.floor(count / 30000));
        let sampleCount = 0;
        let sum = 0;

        for (let p = 0; p < count; p += stride) {
          const index = p * 4;
          const grey = Math.round(values[index] * .299 +
            values[index + 1] * .587 + values[index + 2] * .114);
          histogram[grey]++;
          sampleCount++;
          sum += grey;
        }
        const invert = sum / Math.max(sampleCount, 1) < 115;
        function percentile(frac) {
          let countSoFar = 0;
          const limit = sampleCount * frac;
          for (let i = 0; i < 256; i++) {
            const value = invert ? 255 - i : i;
            countSoFar += histogram[value];
            if (countSoFar >= limit) return i;
          }
          return 255;
        }
        const low = percentile(.02);
        const high = percentile(.98);
        const boost = 255 / Math.max(100, high - low);
        for (let index = 0; index < values.length; index += 4) {
          let grey = Math.round(values[index] * .299 +
            values[index + 1] * .587 + values[index + 2] * .114);
          if (invert) grey = 255 - grey;
          grey = Math.max(0, Math.min(255, Math.round((grey - low) * boost)));
          values[index] = values[index + 1] = values[index + 2] = grey;
          values[index + 3] = 255;
        }
        context.putImageData(imageData, 0, 0);
        return canvas;
      } finally { release(); }
    }


    // Reassemble OCR words by geometry instead of trusting paragraph order.
    // Tesseract.js 5 exposes word boxes (or TSV). OCR content stays local.
    function positionedOcrText(data) {
      let words = [];
      if (Array.isArray(data?.words)) {
        words = data.words.map(item => ({
          text: String(item.text || '').trim(),
          x: Number(item.bbox?.x0), y: Number(item.bbox?.y0),
          right: Number(item.bbox?.x1), bottom: Number(item.bbox?.y1)
        }));
      }
      if (!words.length && typeof data?.tsv === 'string') {
        words = data.tsv.split(/\r?\n/).slice(1, 10001).map(line => {
          const parts = line.split('\t');
          if (parts.length < 12 || parts[0] !== '5') return null;
          const x = Number(parts[6]), y = Number(parts[7]);
          return { text: parts.slice(11).join('\t').trim(), x, y,
            right: x + Number(parts[8]), bottom: y + Number(parts[9]) };
        }).filter(Boolean);
      }
      words = words.filter(item => item.text &&
        Number.isFinite(item.x) && Number.isFinite(item.y) &&
        Number.isFinite(item.right) && Number.isFinite(item.bottom) &&
        item.right > item.x && item.bottom > item.y).slice(0, 10000);
      if (words.length < 2) return '';
      const rows = [];
      words.sort((a, b) => (a.y + a.bottom) / 2 - (b.y + b.bottom) / 2 || a.x - b.x);
      for (const word of words) {
        const center = (word.y + word.bottom) / 2;
        const height = word.bottom - word.y;
        let selected = null;
        let distance = Infinity;
        for (const row of rows) {
          const delta = Math.abs(center - row.center);
          if (delta <= Math.max(3, Math.min(height, row.height) * .58) &&
              delta < distance) {
            selected = row;
            distance = delta;
          }
        }
        if (!selected) {
          rows.push({ center, height, words: [word] });
        } else {
          selected.words.push(word);
          const n = selected.words.length;
          selected.center = (selected.center * (n - 1) + center) / n;
          selected.height = (selected.height * (n - 1) + height) / n;
        }
      }
      rows.sort((a, b) => a.center - b.center);
      return rows.map(row => {
        row.words.sort((a, b) => a.x - b.x);
        let line = '';
        let previous = null;
        for (const word of row.words) {
          if (previous) {
            const gap = word.x - previous.right;
            const height = Math.min(row.height, word.bottom - word.y);
            line += gap > Math.max(15, height * 1.45) ? '\t' : ' ';
          }
          line += word.text;
          previous = word;
        }
        return line.trim();
      }).filter(Boolean).join('\n');
    }

    // Some roster rows wrap a surname to the next OCR line. Only join a
    // numbered, one-word, class-coded row to a lone capitalized word.
    function repairWrappedRosterRows(text) {
      const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
      const output = [];
      let joined = 0;
      const loneWord = /^[\p{Lu}][\p{L}\p{M}'’-]{1,39}$/u;
      const firstAndClass = /^(\s*\d{1,4}\s*[.)-]?\s+)([\p{Lu}][\p{L}\p{M}'’-]{1,39})(\s+)(\d{1,2}\p{Lu}(?:\/\d{1,2}\p{Lu})?)([\s\S]*)$/u;
      for (let i = 0; i < lines.length; i++) {
        // Discard stray OCR bullets between a row number and the name.
        const line = lines[i].replace(/^(\s*\d{1,4}\s+)[·•*]\s+(?=\p{Lu})/u, '$1');
        const match = line.match(firstAndClass);
        const next = lines[i + 1]?.trim() || '';
        if (match && loneWord.test(next) &&
            extractFromLine(line).length === 0 &&
            !/[\p{L}\p{M}]/u.test(match[5])) {
          output.push(match[1] + match[2] + ' ' + next + ' ' + match[4] + match[5]);
          i++;
          joined++;
        } else {
          output.push(line);
        }
      }
      return { text: output.join('\n'), joined };
    }

    function unresolvedOcrRosterRows(text) {
      return String(text || '').split(/\r?\n/).filter(line =>
        /\b\d{1,2}\p{Lu}\b/u.test(line) &&
        /^\s*\d{1,4}\s*[.)-]?\s+/.test(line) &&
        extractFromLine(line).length === 0
      ).length;
    }

    function ocrResult(result) {
      const data = result?.data || {};
      const originalText = typeof data.text === 'string' ? data.text : '';
      const positioned = positionedOcrText(data);
      let best = null;
      for (const variant of positioned ? [originalText, positioned] : [originalText]) {
        const fixed = repairWrappedRosterRows(variant);
        const names = cleanPastedNames(fixed.text);
        if (!best || names.length > best.names.length ||
            (names.length === best.names.length && fixed.joined > best.joined)) {
          best = { text: fixed.text, names, joined: fixed.joined };
        }
      }
      const confidence = Number.isFinite(data.confidence) ? data.confidence : 0;
      return {
        ...(best || { text: originalText, names: [], joined: 0 }),
        confidence,
        unresolved: unresolvedOcrRosterRows(best?.text || originalText)
      };
    }

    function bestOcrResult(first, second) {
      if (!second) return first;
      // More recognized names are helpful, but reject a low-confidence
      // alternative when the first pass already found real candidates.
      if (second.names.length > first.names.length &&
          (second.confidence >= 40 || first.names.length === 0)) return second;
      if (second.names.length === first.names.length &&
          second.confidence > first.confidence + 8) return second;
      return first;
    }

    async function recognizeScreenshot(blob, worker, onRetry) {
      let prepared;
      try { prepared = await prepareOcrImage(blob); } catch (_) {
        // Decoder and canvas limitations should not prevent original OCR.
      }
      try {
        await worker.setParameters({
          tessedit_pageseg_mode: String(window.Tesseract.PSM?.AUTO ?? '3'),
          preserve_interword_spaces: '1'
        });
      } catch (_) {}
      let first;
      try {
        first = ocrResult(await worker.recognize(prepared || blob, { rotateAuto: true }));
      } catch (_) {
        if (!prepared) throw new Error('Image recognition failed');
        first = ocrResult(await worker.recognize(blob));
      } finally {
        if (prepared) {
          prepared.width = 0;
          prepared.height = 0;
        }
      }
      // Global OCR confidence alone hides missing table rows.
      if (first.names.length && first.confidence >= 73 && first.unresolved === 0)
        return first.text;
      onRetry();
      try {
        await worker.setParameters({
          // Block segmentation often restores roster rows split by sparse OCR.
          tessedit_pageseg_mode: String(window.Tesseract.PSM?.SINGLE_BLOCK ?? '6'),
          preserve_interword_spaces: '1'
        });
        const second = ocrResult(await worker.recognize(blob, { rotateAuto: true }));
        return bestOcrResult(first, second).text;
      } catch (_) {
        return first.text;
      }
    }

    async function processImages(blobs) {
      if (documentProcessing) {
        setStatus('imageBusy');
        return;
      }
      const images = Array.from(blobs || []);
      if (!images.length) {
        setStatus('imageClipboardEmpty');
        return;
      }
      if (images.some(image => !supportedImageTypes.has(image.type) &&
          !/\.(?:png|jpe?g|webp|bmp)$/i.test(image.name || ''))) {
        setStatus('imageInvalid');
        return;
      }
      if (images.some(image => image.size > maxImageSize)) {
        setStatus('imageTooLarge');
        return;
      }
      const runId = ++activeRun;
      clearSanitizedOcrReport();
      setDocumentProcessing(true);
      diagnostics = null;
      ui.diagnosticsSection.hidden = true;
      ui.diagnosticsStatus.textContent = '';
      ui.results.hidden = true;
      try {
        const worker = await getOcrWorker();
        const text = [];
        const safeBlocks = [];
        for (let index = 0; index < images.length; index++) {
          setStatus('imageReading', index + 1, images.length);
          const recognized = await recognizeScreenshot(images[index], worker, () => {
            setStatus('imageRetry', index + 1, images.length);
          });
          if (runId !== activeRun) return;
          safeBlocks.push(sanitizeOcrBlock(recognized, index + 1));
          publishSanitizedOcrReport('image_ocr', safeBlocks);
          text.push(recognized);
        }
        // The recognized text remains local and is not copied to diagnostics.
        const names = cleanPastedNames(text.join('\n'));
        showNames(names);
        setStatus('imageReady', getNames().length);
      } catch (_) {
        // Do not log OCR errors: some errors may contain source content.
        setStatus('imageError');
      } finally {
        if (ocrWorker) {
          try { await ocrWorker.terminate(); } catch (_) { /* Already stopped */ }
          ocrWorker = null;
        }
        setDocumentProcessing(false);
      }
    }

    async function processPdfFile(file) {
      if (documentProcessing) { setStatus('imageBusy'); return; }
      clearSanitizedOcrReport();
      const runId = ++activeRun;
      diagnostics = newDiagnostics(file);
      diagnosticsFeedback = '';
      ui.diagnosticsStatus.textContent = '';
      ui.diagnosticsSection.hidden = false;
      ui.results.hidden = true;
      ui.names.value = '';
      setDocumentProcessing(true);
      try {
        const names = await extractPdf(file, runId);
        if (runId !== activeRun) return;
        diagnostics.status = 'completed';
        diagnostics.stage = 'done';
        diagnostics.detected_names_count = names.length;
        showNames(names);
        setStatus('ready', getNames().length);
      } catch (error) {
        diagnostics.status = 'failed';
        diagnostics.error_code = classifyFailure(error, diagnostics.stage);
        const safeTypes = new Set(['TypeError','ReferenceError','RangeError','SyntaxError','Error','PasswordException','InvalidPDFException','MissingPDFException','UnknownErrorException']);
        diagnostics.error_type = error && safeTypes.has(error.name) ? error.name : null;
        setStatus('error');
      } finally {
        if (ocrWorker) {
          try { await ocrWorker.terminate(); } catch (_) {}
          ocrWorker = null;
        }
        setDocumentProcessing(false);
      }
    }

    function handlePastedText(text) {
      if (documentProcessing) { setStatus('imageBusy'); return; }
      clearSanitizedOcrReport();
      ui.sourceText.value = text;
      const names = cleanPastedNames(text);
      diagnostics = null;
      ui.diagnosticsSection.hidden = true;
      ui.diagnosticsStatus.textContent = '';
      showNames(names);
      setStatus('cleanReady', getNames().length);
    }

    function fileKind(file) {
      const type = file.type || '';
      const name = file.name || '';
      if (type === 'application/pdf' || /\.pdf$/i.test(name)) return 'pdf';
      if (supportedImageTypes.has(type) || /\.(png|jpe?g|webp|bmp)$/i.test(name)) return 'image';
      if (['text/plain','text/csv','text/tab-separated-values'].includes(type) || /\.(txt|csv|tsv)$/i.test(name)) return 'text';
      return 'unsupported';
    }

    async function handleInputFiles(fileList) {
      if (documentProcessing) { setStatus('imageBusy'); return; }
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const kinds = files.map(fileKind);
      if (kinds.every(kind => kind === 'image')) {
        await processImages(files);
      } else if (files.length === 1 && kinds[0] === 'pdf') {
        await processPdfFile(files[0]);
      } else if (files.length === 1 && kinds[0] === 'text') {
        try {
          const file = files[0];
          if (file.size > maxImageSize) { setStatus('imageTooLarge'); return; }
          handlePastedText(await file.text());
        } catch (_) { setStatus('textFileError'); }
      } else {
        setStatus('invalidDrop');
      }
    }

    ui.chooseFile.addEventListener('click', () => {
      if (!documentProcessing) ui.file.click();
    });
    ui.file.addEventListener('change', () => {
      const selected = Array.from(ui.file.files || []);
      ui.file.value = '';
      handleInputFiles(selected);
    });
    ui.inputZone.addEventListener('dragenter', event => {
      if (event.dataTransfer && Array.from(event.dataTransfer.types || []).includes('Files')) {
        event.preventDefault();
        ui.inputZone.classList.add('drag-over');
      }
    });
    ui.inputZone.addEventListener('dragover', event => {
      if (!event.dataTransfer) return;
      const types = Array.from(event.dataTransfer.types || []);
      if (types.includes('Files') || types.includes('text/plain')) {
        event.preventDefault();
        event.dataTransfer.dropEffect = documentProcessing ? 'none' : 'copy';
        if (!documentProcessing) ui.inputZone.classList.add('drag-over');
      }
    });
    ui.inputZone.addEventListener('dragleave', event => {
      if (!ui.inputZone.contains(event.relatedTarget)) ui.inputZone.classList.remove('drag-over');
    });
    ui.inputZone.addEventListener('drop', event => {
      event.preventDefault();
      ui.inputZone.classList.remove('drag-over');
      if (event.dataTransfer && event.dataTransfer.files.length) {
        handleInputFiles(event.dataTransfer.files);
      } else if (event.dataTransfer) {
        const text = event.dataTransfer.getData('text/plain');
        if (text) handlePastedText(text);
      }
    });
    ui.pasteImage.addEventListener('click', async () => {
      if (documentProcessing) { setStatus('imageBusy'); return; }
      if (!navigator.clipboard) { setStatus('imageClipboardUnsupported'); return; }
      try {
        if (navigator.clipboard.read) {
          const items = await navigator.clipboard.read();
          const images = [];
          for (const item of items) {
            const type = item.types.find(type => supportedImageTypes.has(type));
            if (type) images.push(await item.getType(type));
          }
          if (images.length) { await processImages(images); return; }
        }
        if (navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text.trim()) { handlePastedText(text); return; }
        }
        setStatus('imageClipboardEmpty');
      } catch (_) { setStatus('imageClipboardDenied'); }
    });
    ui.inputZone.addEventListener('paste', event => {
      if (documentProcessing || !event.clipboardData) return;
      const images = Array.from(event.clipboardData.items || [])
        .filter(item => supportedImageTypes.has(item.type))
        .map(item => item.getAsFile())
        .filter(Boolean);
      if (images.length) {
        event.preventDefault();
        processImages(images);
      } else if (event.target !== ui.sourceText) {
        const text = event.clipboardData.getData('text/plain');
        if (text) {
          event.preventDefault();
          handlePastedText(text);
        }
      }
      // Native text paste into the textarea remains editable; click Extract names.
    });

    ui.cleanButton.addEventListener('click', () => {
      if (!ui.sourceText.value.trim()) {
        setStatus('pasteEmpty');
        return;
      }
      ++activeRun;
      clearSanitizedOcrReport();
      diagnostics = null;
      ui.diagnosticsSection.hidden = true;
      ui.diagnosticsStatus.textContent = '';
      const names = cleanPastedNames(ui.sourceText.value);
      showNames(names);
      setStatus('cleanReady', getNames().length);
    });
    ui.openDebug.addEventListener('click', () => {
      ui.normalView.hidden = true;
      ui.debugView.hidden = false;
      ui.debugSource.focus();
    });
    ui.closeDebug.addEventListener('click', () => {
      ui.debugView.hidden = true;
      ui.normalView.hidden = false;
      ui.openDebug.focus();
    });
    ui.debugSource.addEventListener('input', () => {
      ui.debugOutput.hidden = true;
      ui.debugReport.value = '';
      ui.debugStatus.textContent = '';
    });
    ui.debugGenerate.addEventListener('click', () => {
      if (!ui.debugSource.value.trim()) {
        ui.debugStatus.textContent = translate('debugEmpty');
        ui.debugOutput.hidden = true;
        return;
      }
      ui.debugReport.value = makeSanitizedDebugReport(ui.debugSource.value);
      ui.debugOcrCopy.hidden = true;
      ui.debugCopy.hidden = false;
      ui.debugOutputLabel.textContent = translate('debugOutputLabel');
      ui.debugOutput.hidden = false;
      ui.debugStatus.textContent = translate('debugReady');
    });
    ui.debugOcrShow.addEventListener('click', () => {
      if (!latestOcrDebugReport) return;
      ui.debugReport.value = latestOcrDebugReport;
      ui.debugCopy.hidden = true;
      ui.debugOcrCopy.hidden = false;
      ui.debugOutputLabel.textContent = translate('debugOcrOutputLabel');
      ui.debugOutput.hidden = false;
      ui.debugStatus.textContent = translate('debugReady');
    });
    async function copyVisibleSanitizedDebug() {
      const report = ui.debugReport.value;
      if (!report || ui.debugOutput.hidden) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(report);
        } else {
          ui.debugReport.focus();
          ui.debugReport.select();
          if (!document.execCommand('copy')) throw new Error('Clipboard unavailable');
        }
        ui.debugStatus.textContent = translate('debugCopied');
      } catch (_) {
        ui.debugStatus.textContent = translate('debugCopyError');
      }
    }
    ui.debugCopy.addEventListener('click', copyVisibleSanitizedDebug);
    ui.debugOcrCopy.addEventListener('click', copyVisibleSanitizedDebug);
    ui.settingsButton.addEventListener('click', () => {
      ui.settingsPanel.hidden = !ui.settingsPanel.hidden;
      ui.settingsButton.setAttribute('aria-expanded', String(!ui.settingsPanel.hidden));
    });
    ui.settingsClose.addEventListener('click', () => {
      ui.settingsPanel.hidden = true;
      ui.settingsButton.setAttribute('aria-expanded', 'false');
      ui.settingsButton.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !ui.settingsPanel.hidden) {
        ui.settingsPanel.hidden = true;
        ui.settingsButton.setAttribute('aria-expanded', 'false');
        ui.settingsButton.focus();
      }
    });
    ui.filterProducts.addEventListener('change', () => {
      syncEditedNames();
      filterProductsEnabled = ui.filterProducts.checked;
      renderNames();
    });
    ui.lastFirstButton.addEventListener('click', () => {
      syncEditedNames();
      lastNameFirst = !lastNameFirst;
      renderNames();
    });
    ui.hideMiddleButton.addEventListener('click', () => {
      syncEditedNames();
      hideMiddleNames = !hideMiddleNames;
      renderNames();
    });
    ui.diagnosticsCopy.addEventListener('click', copyDiagnostics);
    ui.language.addEventListener('click', () => {
      ui.language.value = ui.language.value === 'en' ? 'fi' : 'en';
      localize();
    });
    ui.names.addEventListener('input', updateCount);
    document.querySelectorAll('[data-export]').forEach(button => {
      button.addEventListener('click', () => exportNames(button.dataset.export));
    });
    localize();
  </script>
</body>
</html>
